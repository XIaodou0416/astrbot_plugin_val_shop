name: ValShop

options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""

targets:
  ValShop:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - ValShop
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.guji.valshop
        PRODUCT_NAME: ValShop
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: VALORANT SHOP
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.games
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads: YES
        SWIFT_EMIT_LOC_STRINGS: YES
    info:
      path: ValShop/Info.plist
      properties:
        CFBundleDisplayName: VALORANT SHOP
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        NSCameraUsageDescription: 用于扫码登录无畏契约账号。
        NSPhotoLibraryUsageDescription: 用于保存商店图片。
        UIBackgroundModes:
          - fetch

  ValShopTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - ValShopTests
    dependencies:
      - target: ValShop
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.guji.valshop.tests

schemes:
  ValShop:
    build:
      targets:
        ValShop: all
    test:
      targets:
        - ValShopTests
