name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - codex/ios-val-shop-20261018

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Run tests
        run: xcodebuild test -project ValShop.xcodeproj -scheme ValShop -destination 'platform=iOS Simulator,name=iPhone 17' CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
      - name: Build unsigned app
        run: |
          xcodebuild -project ValShop.xcodeproj -scheme ValShop -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/ValShop.app Payload/
          /usr/bin/zip -qry VALORANT-SHOP-unsigned.ipa Payload
          unzip -t VALORANT-SHOP-unsigned.ipa
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: VALORANT-SHOP-unsigned-ipa
          path: VALORANT-SHOP-unsigned.ipa
